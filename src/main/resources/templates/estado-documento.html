<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Estado del Documento</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f2f2f2; padding: 20px; }
        .container { background: #fff; padding: 20px; border-radius: 8px; }
        .titulo { font-size: 18px; font-weight: bold; color: #2c3e50; }
        .mensaje { margin-top: 10px; font-size: 15px; color: #333; }
    </style>
</head>
<body>
<div class="container">
    <p class="titulo">Hola,</p>
    <p class="mensaje">Tu documento ha sido revisado.</p>
    <p class="mensaje"><strong>Estado:</strong> <span style="color: #007bff;">{{estadoTexto}}</span></p>
    <p class="mensaje"><strong>Mensaje del moderador:</strong></p>
    <p class="mensaje">{{mensaje}}</p>
    <p class="mensaje">Por favor revisa el sistema para más detalles.</p>
    <br>
    <p class="mensaje">Gracias,<br>Equipo JuanData</p>
</div>
</body>
</html>
