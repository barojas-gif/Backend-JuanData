# ===========================
# SERVIDOR (RENDER)
# ===========================
server.port=${PORT:8080}

# ===========================
# BASE DE DATOS (NEON)
# ===========================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===========================
# JPA / HIBERNATE
# ===========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.javax.persistence.validation.mode=none

# ===========================
# CORREO
# Render (plan gratuito) bloquea SMTP en puertos 25, 465 y 587.
# Opciones: plan de pago en Render, o proveedor con puerto 2525 / API HTTP.
# Ejemplo SendGrid SMTP: host=smtp.sendgrid.net, port=2525, username=apikey
# ===========================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# ===========================
# JWT
# ===========================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}

# ===========================
# CORS
# ===========================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# ===========================
# SERVIDOR
# ===========================
server.max-http-request-header-size=40KB